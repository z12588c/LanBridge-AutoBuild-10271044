name: Build LanBridge Windows EXE & Android APK
​on:
push:
branches: [ "main", "master" ]
tags: [ "v*" ]
workflow_dispatch:
​permissions:
contents: write
​jobs:
build-windows-exe:
name: 编译 Windows EXE
runs-on: windows-latest
steps:
- name: 检出仓库代码
uses: actions/checkout@v4
​- name: 配置 Python 3.11 环境
uses: actions/setup-python@v5
with:
python-version: '3.11'
​- name: 自动清理源码并安装 PyInstaller
run: |
python - << 'PYCLEAN'
import pathlib
p = pathlib.Path("lanbridge_windows.py")
if p.exists():
txt = p.read_text(encoding="utf-8", errors="ignore")
marker = "root.mainloop()"
if marker in txt:
txt = txt[:txt.find(marker) + len(marker)] + "\n"
p.write_text(txt, encoding="utf-8")
PYCLEAN
python -m pip install --upgrade pip
pip install pillow mss pyautogui pyinstaller
​- name: 打包独立单文件 EXE
run: |
pyinstaller -F -w --name LanBridge_Win lanbridge_windows.py
​- name: 上传 LanBridge_Win.exe 构建产物
uses: actions/upload-artifact@v4
with:
name: LanBridge-Windows-EXE
path: dist/LanBridge_Win.exe
​build-android-apk:
name: 编译 Android APK
runs-on: ubuntu-latest
steps:
- name: 检出仓库代码
uses: actions/checkout@v4
​- name: 配置 Java 17 环境
uses: actions/setup-java@v4
with:
distribution: 'temurin'
java-version: '17'
​- name: 配置 Flutter 环境
uses: subosito/flutter-action@v2
with:
channel: 'stable'
​- name: 初始化 Flutter 工程并自动修复与注入源码
run: |
flutter create --org com.lanbridge --project-name lanbridge_app --platforms android build_app
cd build_app
flutter pub add file_picker:8.3.7
python3 - << 'PYEOF'
import pathlib, re
​# 1. 自动配置 subprojects compileSdk 36
kts = pathlib.Path("android/build.gradle.kts")
groovy = pathlib.Path("android/build.gradle")
if kts.exists():
kts.write_text(kts.read_text(encoding="utf-8") + """
subprojects {
if (project.name != "app") {
afterEvaluate {
val androidExt = extensions.findByName("android")
if (androidExt is com.android.build.gradle.BaseExtension) {
androidExt.compileSdkVersion(36)
}
}
}
}
""", encoding="utf-8")
elif groovy.exists():
groovy.write_text(groovy.read_text(encoding="utf-8") + """
subprojects { p ->
if (p.name != "app") {
p.afterEvaluate {
if (p.hasProperty("android")) {
p.android.compileSdkVersion 36
}
}
}
}
""", encoding="utf-8")
​# 2. 清理并修复 Dart 源码（去除可能误粘贴的尾部脚本，修复 decodeImageFromList 语法）
dart_src = pathlib.Path("../lanbridge_android_main.dart").read_text(encoding="utf-8", errors="ignore").replace("\r\n", "\n")
if "#!/" in dart_src:
dart_src = dart_src[:dart_src.find("#!/")]
dart_src = dart_src.replace(
"decodeImageFromList(frameBytes, (img) {",
"decodeImageFromList(frameBytes).then((img) {"
)
pathlib.Path("lib/main.dart").write_text(dart_src, encoding="utf-8")
​# 3. 清理并注入 Kotlin 原生代码（移除可能导致未解析引用的 androidx.annotation）
kotlin_dir = pathlib.Path("android/app/src/main/kotlin/com/lanbridge/lanbridge_app")
kotlin_dir.mkdir(parents=True, exist_ok=True)
​svc_code = pathlib.Path("../LanBridgeControlService.kt").read_text(encoding="utf-8", errors="ignore").replace("\r\n", "\n")
if "#!/" in svc_code:
svc_code = svc_code[:svc_code.find("#!/")]
svc_code = svc_code.replace("package com.lanbridge.app", "package com.lanbridge.lanbridge_app")
svc_code = svc_code.replace("import androidx.annotation.RequiresApi", "")
svc_code = svc_code.replace("@RequiresApi(Build.VERSION_CODES.N)", "")
​main_code = pathlib.Path("../MainActivity.kt").read_text(encoding="utf-8", errors="ignore").replace("\r\n", "\n")
if "#!/" in main_code:
main_code = main_code[:main_code.find("#!/")]
main_code = main_code.replace("package com.lanbridge.app", "package com.lanbridge.lanbridge_app")
if "performDoubleTap" not in svc_code:
main_code = main_code.replace("svc.performDoubleTap(x, y)", "svc.performTap(x, y)")
​(kotlin_dir / "LanBridgeControlService.kt").write_text(svc_code, encoding="utf-8")
(kotlin_dir / "MainActivity.kt").write_text(main_code, encoding="utf-8")
​# 4. 写入无障碍服务 XML 配置
xml_dir = pathlib.Path("android/app/src/main/res/xml")
xml_dir.mkdir(parents=True, exist_ok=True)
(xml_dir / "accessibility_service_config.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
<accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
android:accessibilityEventTypes="typeAllMask"
android:accessibilityFeedbackType="feedbackGeneric"
android:accessibilityFlags="flagDefault"
android:canPerformGestures="true"
android:canRetrieveWindowContent="true"
android:notificationTimeout="50" />
""".strip(), encoding="utf-8")
​# 5. 写入 AndroidManifest.xml
manifest = pathlib.Path("android/app/src/main/AndroidManifest.xml")
manifest.write_text("""<manifest xmlns:android="http://schemas.android.com/apk/res/android">
<uses-permission android:name="android.permission.INTERNET"/>
<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
<uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>
<uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE"/>
<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
<uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
<uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION"/>
​<application
android:label="LanBridge"
android:name="${applicationName}"
android:icon="@mipmap/ic_launcher"
android:requestLegacyExternalStorage="true">
<activity
android:name=".MainActivity"
android:exported="true"
android:launchMode="singleTop"
android:theme="@style/LaunchTheme"
android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
android:hardwareAccelerated="true"
android:windowSoftInputMode="adjustResize">
<meta-data
android:name="io.flutter.embedding.android.NormalTheme"
android:resource="@style/NormalTheme"
/>
<intent-filter>
<action android:name="android.intent.action.MAIN"/>
<category android:name="android.intent.category.LAUNCHER"/>
</intent-filter>
</activity>
​<service
android:name=".LanBridgeControlService"
android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
android:exported="true">
<intent-filter>
<action android:name="android.accessibilityservice.AccessibilityService" />
</intent-filter>
<meta-data
android:name="android.accessibilityservice"
android:resource="@xml/accessibility_service_config" />
</service>
​<meta-data
android:name="flutterEmbedding"
android:value="2" />
</application>
</manifest>
""".strip(), encoding="utf-8")
print("All Android project files cleaned and injected successfully.")
PYEOF
​- name: 编译 Release 版 APK
working-directory: build_app
run: |
flutter build apk --release
cp build/app/outputs/flutter-apk/app-release.apk ../LanBridge_Android.apk
​- name: 上传 LanBridge_Android.apk 构建产物
uses: actions/upload-artifact@v4
with:
name: LanBridge-Android-APK
path: LanBridge_Android.apk