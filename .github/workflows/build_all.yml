name: Build LanBridge Windows EXE & Android APK
​on:
push:
branches: [ "main", "master" ]
tags: [ "v*" ]
workflow_dispatch:  # 支持在 GitHub 页面手动点击 "Run workflow" 一键触发
​permissions:
contents: write
​jobs:
​=========================================================================
​任务 1：在云端 Windows 虚拟机自动编译打包 LanBridge_Win.exe
​=========================================================================
​build-windows-exe:
name: 编译 Windows EXE
runs-on: windows-latest
steps:
- name: 检出仓库代码
uses: actions/checkout@v4
​- name: 配置 Python 3.11 环境
uses: actions/setup-python@v5
with:
python-version: '3.11'
​- name: 安装依赖与 PyInstaller
run: |
python -m pip install --upgrade pip
pip install pillow mss pyautogui pyinstaller
​- name: 使用 PyInstaller 打包独立单文件 EXE
run: |
pyinstaller -F -w --name LanBridge_Win lanbridge_windows.py
​- name: 上传 LanBridge_Win.exe 构建产物
uses: actions/upload-artifact@v4
with:
name: LanBridge-Windows-EXE
path: dist/LanBridge_Win.exe
​=========================================================================
​任务 2：在云端 Ubuntu 虚拟机自动生成 Flutter 工程并打包 LanBridge_Android.apk
​=========================================================================
​build-android-apk:
name: 编译 Android APK
runs-on: ubuntu-latest
steps:
- name: 检出仓库代码
uses: actions/checkout@v4
​- name: 配置 Java 17 环境
uses: actions/setup-java@v4
with:
distribution: 'temurin'
java-version: '17'
​- name: 配置 Flutter 环境
uses: subosito/flutter-action@v2
with:
channel: 'stable'
​- name: 自动初始化 Flutter Android 工程结构并注入源码
run: |
flutter create --org com.lanbridge --project-name lanbridge_app --platforms android build_app
cd build_app
flutter pub add file_picker:8.3.7
​# 0. 强制所有第三方插件使用 compileSdk 36（修复 file_picker 等插件 compileSdk 过低导致的 checkReleaseAarMetadata 报错）
if [ -f android/build.gradle.kts ]; then
cat << 'EOF2' >> android/build.gradle.kts
​subprojects {
if (project.name != "app") {
afterEvaluate {
val androidExt = extensions.findByName("android")
if (androidExt is com.android.build.gradle.BaseExtension) {
androidExt.compileSdkVersion(36)
}
}
}
}
EOF2
elif [ -f android/build.gradle ]; then
cat << 'EOF2' >> android/build.gradle
​subprojects { p ->
if (p.name != "app") {
p.afterEvaluate {
if (p.hasProperty("android")) {
p.android.compileSdkVersion 36
}
}
}
}
EOF2
fi
​# 1. 覆盖 Flutter 主界面与通信源码，并自动修复 decodeImageFromList 异步 Future 语法
cp ../lanbridge_android_main.dart lib/main.dart
sed -i 's/decodeImageFromList(frameBytes, (img) {/decodeImageFromList(frameBytes).then((img) {/g' lib/main.dart
​# 2. 注入 Kotlin 原生无障碍反控服务与屏幕录制桥接代码
KOTLIN_DIR="android/app/src/main/kotlin/com/lanbridge/lanbridge_app"
mkdir -p "$KOTLIN_DIR"
sed 's/package com.lanbridge.app/package com.lanbridge.lanbridge_app/g' ../LanBridgeControlService.kt > "$KOTLIN_DIR/LanBridgeControlService.kt"
sed 's/package com.lanbridge.app/package com.lanbridge.lanbridge_app/g' ../MainActivity.kt > "$KOTLIN_DIR/MainActivity.kt"
​# 兼容检查：若仓库中的 LanBridgeControlService.kt 为旧版（未包含 performDoubleTap），自动降级为 performTap 防止 Kotlin 编译报错
if ! grep -q "performDoubleTap" "$KOTLIN_DIR/LanBridgeControlService.kt"; then
sed -i 's/svc.performDoubleTap(x, y)/svc.performTap(x, y)/g' "$KOTLIN_DIR/MainActivity.kt"
fi
​# 3. 生成无障碍服务配置文件 res/xml/accessibility_service_config.xml
mkdir -p android/app/src/main/res/xml
cat << 'EOF' > android/app/src/main/res/xml/accessibility_service_config.xml
<?xml version="1.0" encoding="utf-8"?>
<accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
android:accessibilityEventTypes="typeAllMask"
android:accessibilityFeedbackType="feedbackGeneric"
android:accessibilityFlags="flagDefault"
android:canPerformGestures="true"
android:canRetrieveWindowContent="true"
android:notificationTimeout="50" />
EOF
​# 4. 写入包含局域网、文件读写与无障碍手势权限的 AndroidManifest.xml
cat << 'EOF' > android/app/src/main/AndroidManifest.xml
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
<uses-permission android:name="android.permission.INTERNET"/>
<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
<uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>
<uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE"/>
<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
<uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
<uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION"/>
​<application
android:label="LanBridge"
android:name="${applicationName}"
android:icon="@mipmap/ic_launcher"
android:requestLegacyExternalStorage="true">
<activity
android:name=".MainActivity"
android:exported="true"
android:launchMode="singleTop"
android:theme="@style/LaunchTheme"
android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
android:hardwareAccelerated="true"
android:windowSoftInputMode="adjustResize">
<meta-data
android:name="io.flutter.embedding.android.NormalTheme"
android:resource="@style/NormalTheme"
/>
<intent-filter>
<action android:name="android.intent.action.MAIN"/>
<category android:name="android.intent.category.LAUNCHER"/>
</intent-filter>
</activity>
​<service
android:name=".LanBridgeControlService"
android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
android:exported="true">
<intent-filter>
<action android:name="android.accessibilityservice.AccessibilityService" />
</intent-filter>
<meta-data
android:name="android.accessibilityservice"
android:resource="@xml/accessibility_service_config" />
</service>
​<meta-data
android:name="flutterEmbedding"
android:value="2" />
</application>
</manifest>
EOF
​- name: 编译 Release 版 APK
working-directory: build_app
run: |
flutter build apk --release
cp build/app/outputs/flutter-apk/app-release.apk ../LanBridge_Android.apk
​- name: 上传 LanBridge_Android.apk 构建产物
uses: actions/upload-artifact@v4
with:
name: LanBridge-Android-APK
path: LanBridge_Android.apk